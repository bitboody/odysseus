[package]
name = "odysseus"
version = "0.1.0"
description = "Odysseus Desktop Launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
base64 = "0.23.1"

[lib]
name = "odysseus_lib"
crate-type = ["lib"]
